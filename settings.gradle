pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

// Flywheel, Ponder and Catnip come from mavenLocal, and are published there from the checkouts
// beside this one. `-PfromSource` swaps in composite builds instead, so a change shows up without
// publishing -- useful while iterating, and off by default for a reason.
//
// Off by default because the two paths are not equivalent, and the difference is not academic.
// Built as composite projects, block interaction breaks: MultiblockTest finds that breaking a vault
// out of a machine drops nothing, and TrainCircuitTest that the crosshair is not on the block the
// player is looking at. The same source published to mavenLocal and consumed as a jar passes both.
// So the composite path changes behaviour by itself, and anything measured under it is suspect.
//
// The workflow this settles on: publishToMavenLocal in Flywheel and Ponder, then build here. It is
// a step to remember, but it is the one that tests what will ship.
def fromSource = providers.gradleProperty("fromSource").isPresent()

if (fromSource && file("../Flywheel/settings.gradle.kts").exists()) {
    includeBuild("../Flywheel") {
        dependencySubstitution {
            // One project publishes both artifacts -- the full jar and an api-only jar cut from the
            // same classes -- so both names resolve to it.
            substitute(module("dev.engine-room.flywheel:flywheel-neoforge-$minecraft_version"))
                .using(project(":neoforge"))
            substitute(module("dev.engine-room.flywheel:flywheel-neoforge-api-$minecraft_version"))
                .using(project(":neoforge"))
        }
    }
}

if (fromSource && file("../Ponder/settings.gradle.kts").exists()) {
    includeBuild("../Ponder") {
        dependencySubstitution {
            substitute(module("net.createmod.ponder:ponder-neoforge")).using(project(":neoforge"))
            substitute(module("net.createmod.ponder:ponder-common")).using(project(":common"))
            substitute(module("net.createmod.catnip:catnip-neoforge")).using(project(":catnip:neoforge"))
            substitute(module("net.createmod.catnip:catnip-common")).using(project(":catnip:common"))
        }
    }
}

rootProject.name = "$mod_id-$minecraft_version"
