plugins {
    id("idea")
    id("eclipse")
    id("maven-publish")
    id("net.kyori.blossom") version "2.2.0" // https://github.com/KyoriPowered/blossom
    id("dev.ithundxr.silk") version "1.0.1" // https://github.com/ithundxr/silk
    id("net.neoforged.moddev") version "2.0.144" // https://projects.neoforged.net/neoforged/ModDevGradle
    id("me.modmuss50.mod-publish-plugin") version "1.1.0" // https://github.com/modmuss50/mod-publish-plugin
    // Client gametests: builds src/gametest as its own mod and adds the runClientGameTest run.
    // Built from Wurst-Imperium/neoforge-client-gametest-api branch 26.2 and published to mavenLocal.
    id("net.wimods.neoforge-client-gametest-api") version "0.1.0+26.2"
}

boolean dev = System.getenv("RELEASE") == null || System.getenv("RELEASE") == "false"
String buildNumber = System.getenv("BUILD_NUMBER")
String gitHash = calculateGitHash() + (hasUnstaged() ? "-modified" : "")

group = "com.simibubi.create"
version = mod_version + (dev && buildNumber != null ? "-${buildNumber}" : "")

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

println("Java: ${System.getProperty("java.version")}, JVM: ${System.getProperty("java.vm.version")} (${System.getProperty("java.vendor")}), Arch: ${System.getProperty("os.arch")}")

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neo_version

    accessTransformers {
        publish(file("src/main/resources/META-INF/accesstransformer.cfg"))
    }

    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_minecraft_version == "same" ? minecraft_version : parchment_minecraft_version
            mappingsVersion = parchment_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            jvmArgument("-XX:+IgnoreUnrecognizedVMOptions")
            jvmArgument("-XX:+AllowEnhancedClassRedefinition")

            // -PguiBeat=<millis> rests that long after every click and scroll a gui test makes, so a
            // run can be watched and followed. Off by default: a full run has nobody watching it.
            if(project.hasProperty("guiBeat"))
                systemProperty("create.gametest.gui.beatMillis", project.property("guiBeat"))

            // -Pjdwp=<port> waits for a debugger to attach before the game starts, which is the only
            // way to have breakpoints in place before a gametest has been and gone.
            if(project.hasProperty("jdwp"))
                jvmArgument("-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:"
                    + project.property("jdwp"))
            //jvmArgument("-XX:-OmitStackTraceInFastThrow") // uncomment when you get exceptions with null messages etc
            //jvmArgument("-XX:+UnlockCommercialFeatures") // uncomment for profiling

            systemProperty("mixin.debug.verbose", "true")
            systemProperty("mixin.debug.export", "true")

            systemProperty("neoforge.enabledGameTestNamespaces", mod_id as String)

            loggingConfigFile = project.file("log4j.xml")
        }

        client {
            client()

            // -PquickPlay=<world folder> boots straight into that singleplayer world, which saves
            // walking the menus on every launch when testing a render change.
            if (project.hasProperty("quickPlay")) {
                programArgument("--quickPlaySingleplayer")
                programArgument(project.property("quickPlay") as String)
            }
        }

        server {
            server()

            gameDirectory = project.file("run/server")

            programArgument("--nogui")
        }

        // 26.2 splits datagen by side, so there are two runs rather than one.
        clientData {
            clientData()

            // -PdataOut=<dir> writes elsewhere than the committed tree. Datagen prunes output it no
            // longer produces, so while the providers are only partly ported, generating in place
            // would delete the files the unported ones used to write.
            programArguments.addAll(
                "--mod", mod_id as String,
                "--all",
                "--output", (project.hasProperty("dataOut") ? file(project.property("dataOut") as String)
                    : file("src/generated/resources/")).getAbsolutePath(),
                "--existing", file("src/main/resources/").getAbsolutePath()
            )
        }

        serverData {
            serverData()

            programArguments.addAll(
                "--mod", mod_id as String,
                "--all",
                "--output", (project.hasProperty("dataOut") ? file(project.property("dataOut") as String)
                    : file("src/generated/resources/")).getAbsolutePath(),
                "--existing", file("src/main/resources/").getAbsolutePath()
            )
        }

        gameTestServer {
            type = "gameTestServer"
        }
    }
}

repositories {
    mavenLocal() // Registrate, Flywheel, Ponder and Catnip, all built from source for 26.2
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    maven { url = "https://maven.theillusivec4.top/" } // Curios API
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.ftb.dev/releases" } // FTB Mods
    maven { url = "https://maven.architectury.dev" } // Arch API
    // NeoForge config api port, needed by ponder
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
    maven {
        url = "https://jm.gserv.me/repository/maven-public" // JourneyMap
        content {
            includeGroup "info.journeymap"
            includeGroup "mysticdrew"
        }
    }
    maven { url "https://chocolateminecraft.com/maven" } // Xaero
}

configurations {
    localImplementation

    // The Sodium artifact on Modrinth is a bootstrap: the mod itself, API included, is a nested jar.
    sodiumBundle

    runtimeClasspath.extendsFrom(localImplementation)
    compileClasspath.extendsFrom(localImplementation)

    runtimeClasspath.extendsFrom(localRuntimeOnly)
}

// Sodium ships its API inside META-INF/jarjar rather than in the artifact Gradle resolves, so the
// nested jar is unpacked and compiled against directly.
var extractSodiumApi = tasks.register("extractSodiumApi", Copy) {
    from({ configurations.sodiumBundle.collect { zipTree(it) } }) {
        include("META-INF/jarjar/*mod.jar")
        eachFile { it.relativePath = new RelativePath(true, "sodium-api.jar") }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir("sodium"))
}

dependencies {
    // Required dependencies. These are all built from source for 26.2 and published to mavenLocal;
    // none of them are jarJar'd yet because the published coordinates do not exist upstream.
    api("com.tterrag.registrate:Registrate:$registrate_version")

    compileOnlyApi("dev.engine-room.flywheel:flywheel-neoforge-api-$minecraft_version:$flywheel_version")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-$minecraft_version:$flywheel_version")

    api("net.createmod.ponder:ponder-neoforge:$ponder_version")
    // Catnip used to come along with Ponder; on the 26.x branches it is published separately.
    api("net.createmod.catnip:catnip-neoforge:$ponder_version")

    // Local dependencies - not published to consumers
    localImplementation("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")

    compileOnly("top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version:api")
    localRuntimeOnly("top.theillusivec4.curios:curios-neoforge:$curios_version+$minecraft_version")

    sodiumBundle("maven.modrinth:sodium:mc$minecraft_version-$sodium_version-neoforge")
    compileOnly(files(layout.buildDirectory.file("sodium/sodium-api.jar")) {
        builtBy(extractSodiumApi)
    })

    if (cc_tweaked_enable.toBoolean()) {
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-core-api:$cc_tweaked_version")
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge-api:$cc_tweaked_version")
        localRuntimeOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge:$cc_tweaked_version")
    }

    localImplementation("maven.modrinth:journeymap:$journeymap_version")
    localImplementation("info.journeymap:journeymap-api-neoforge:$journeymap_api_version") {
        exclude(group: "curse.maven") // Pulls in an old version of JourneyMap which is for Forge
    }

    // Farmer's Delight, FTB, Xaero and Architectury have no 26.2 builds, so their integrations are
    // compiled out for now (see sourceSets below and farmers_delight_enable).
}

// ModDevGradle 2.0.144 does not know Minecraft 26.2, so its version capability table falls back to
// requesting Java 21 for the NeoFormRuntime tasks. Gradle 9 cannot auto-provision one either: the
// foojay resolver still references JvmVendorSpec.IBM_SEMERU, which Gradle 9 removed.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable.set(javaToolchains.launcherFor(java.toolchain).map { it.executablePath.asFile.absolutePath })
}

sourceSets.main {
    java {
        if (!cc_tweaked_enable.toBoolean()) {
            exclude("com/simibubi/create/compat/computercraft/implementation/**")
        }

        if (!farmers_delight_enable.toBoolean()) {
            exclude("com/simibubi/create/compat/farmersdelight/**")
        }

        // FTB Chunks and Xaero have no 26.2 builds, so their APIs are not on the
        // classpath and these adapters cannot compile. Create's own train map - the sync, the
        // manager and the renderer - is unaffected.
        // TODO: restore these once the minimap mods update.
        exclude("com/simibubi/create/compat/trainmap/FTBChunksTrainMap.java")
        exclude("com/simibubi/create/compat/trainmap/XaeroTrainMap.java")
        exclude("com/simibubi/create/foundation/mixin/compat/xaeros/**")

        // Minecraft 1.21.5 replaced the annotation-driven gametest framework (@GameTest,
        // TestFunction, StructureUtils) with data-driven GameTestInstance. Nothing outside the
        // package references it and it never ships in the mod's runtime path.
        // TODO: port the gametests to GameTestInstance and drop this exclusion.
        exclude("com/simibubi/create/infrastructure/gametest/**")
    }

    resources {
        srcDir("src/generated/resources")
        exclude(".cache/")
        exclude("data/create/.wiki")
    }

    blossom.javaSources {
        property("version", mod_version)
        property("gitCommit", gitHash.toString())
    }
}

jar {
    from("LICENSE.md") {
        rename { "${mod_name}_${it}" }
    }
}

tasks.withType(Jar).configureEach {
    manifest.attributes([
        "Git-Hash": gitHash
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // javac stops at 100 errors by default, which hides the real scale during a port.
    options.compilerArgs.addAll(["-Xmaxerrs", "100000"])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        "mod_version"           : mod_version,
        "mod_id"                : mod_id,
        "mod_name"              : mod_name,
        "mod_author"            : mod_author,
        "mod_description"       : mod_description,
        "mod_license"           : mod_license,
        "neo_version"           : neo_version,
        "minecraft_version"     : minecraft_version,
        "ponder_version"        : ponder_version,
        "flywheel_version_range": flywheel_version_range,
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from("src/main/templates")
    into("build/generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from(components.java)
        }
    }

    repositories {
        maven {
            url = "https://maven.createmod.net"
            credentials {
                username = providers.environmentVariable("MAVEN_USERNAME").orNull
                password = providers.environmentVariable("MAVEN_PASSWORD").orNull
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    changelog = silk.changelog
    type = STABLE
    version = "$mod_version+mc$minecraft_version"
    displayName = "$mod_name $mod_version for mc$minecraft_version"
    modLoaders.add("neoforge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "328085"
        minecraftVersions.add(minecraft_version)
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "LNytGWDc"
        minecraftVersions.add(minecraft_version)
    }

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "Creators-of-Create/Create"
        commitish = gitHash
        tagName = "mc$minecraft_version-$mod_version"
        file.unset()
        file.unsetConvention()

        allowEmptyFiles = true
    }
}

String calculateGitHash() {
    try {
        ExecOutput output = providers.exec {
            commandLine("git", "rev-parse", "HEAD")
        }
        return output.standardOutput.asText.get().trim()
    } catch (Throwable ignored) {
        return "unknown"
    }
}

boolean hasUnstaged() {
    try {
        ExecOutput output = providers.exec {
            commandLine("git", "status", "--porcelain")
        }
        String result = output.standardOutput.asText.get().replace("/M gradlew(\\.bat)?/", "").trim()
        if (!result.isEmpty())
            println("Found stageable results:\n ${result}\n")
        return !result.isEmpty()
    } catch (Throwable ignored) {
        return false
    }
}

// A single-file javac check, since the full compile under-reports while the port is mid-flight.
tasks.register("printCompileClasspath") {
    doLast {
        var cp = sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
        new File(project.layout.buildDirectory.get().asFile, "compile-classpath.txt").text = cp
    }
}
